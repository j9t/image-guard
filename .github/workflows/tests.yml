name: "Tests"

on:
  push:
    branches: main
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        platform: [ubuntu-latest]
        node: ["lts/*", "current"]
        include:
          # Windows: One LTS job is enough
          - platform: windows-latest
            node: "lts/*"
    name: "Node ${{ matrix.node }} (${{ matrix.platform }})"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: "Install dependencies"
        run: npm ci
      - name: "Lint"
        # Lint results don’t vary by platform or Node version
        if: matrix.platform == 'ubuntu-latest' && matrix.node == 'lts/*'
        run: npm run lint
      - name: "Run tests"
        run: npm test
      - name: "Run as installed package"
        # Calls the bin through bash, as Git hooks do (Command Prompt and PowerShell aren’t supported on Windows)
        if: matrix.node == 'lts/*'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npm init -y
          npm install ./image-guard-*.tgz
          # Not `npx`, which answers `--version` itself when the bin is missing
          out="$(node_modules/.bin/image-guard --version)"
          [ "$out" = "$version" ] || { echo "Unexpected output: $out" >&2; exit 1; }
      - name: "Run through npm from PowerShell"
        # Checks the README’s Windows setup, which has npm run commands through Git Bash
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          cd $env:RUNNER_TEMP
          npm config set script-shell "C:\Program Files\Git\bin\bash.exe"
          npm pkg set scripts.check="image-guard --version"
          $out = npm run --silent check
          if ($out -ne $version) { throw "Unexpected output: $out" }

  # sharp and heic-decode ship native binaries
  test-macos:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: "Node lts/* (macOS)"
    runs-on: macos-latest
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: "Install dependencies"
        run: npm ci
      - name: "Run tests"
        run: npm test